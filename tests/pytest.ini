# Run from the repository root: python -m pytest tests
# The ini lives here, not in the root, so pytest's rootdir is tests/: the root holds ComfyUI's package
# __init__.py (kept unchanged on purpose), which pytest would otherwise import and which fails outside ComfyUI.
#
# Default "prepend" import mode with no __init__.py in test folders: every test file name must be unique.
# (importlib mode would register tests/src as the `src` package and hide the real one.)
[pytest]
pythonpath = ..
