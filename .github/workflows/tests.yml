# Runs the tests on a clean checkout: catches a file left out of a commit or a package missing from
# requirements-dev.txt before users get the change through "Check for updates". No GPU: the pipeline is faked.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        # The CPU build of torch first: from PyPI, pip would take the CUDA build of several GB.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q
